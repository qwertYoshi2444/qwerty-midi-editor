<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>piano roll</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="My App">
    
    <link rel="apple-touch-icon" href="img/icon-192.png">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3032">
    
    <style>
        body { 
            margin: 0; padding: 0; 
            background-color: #2c3032; color: #d0d0d0; 
            font-family: 'Segoe UI', sans-serif; 
            overflow: hidden; 
            user-select: none;
            touch-action: none;
            overscroll-behavior: none;
            padding-bottom: env(safe-area-inset-bottom);
            padding-top: env(safe-area-inset-top);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }
        
        #app-container { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
        
        #toolbar { 
            height: 40px; background-color: #3b4043; border-bottom: 1px solid #1a1c1d; 
            display: flex; align-items: center; padding: 0 10px; font-size: 14px; gap: 15px; flex-shrink: 0;
            z-index: 100; 
        }
        
        .tool-btn-group { display: flex; gap: 2px; background-color: #1e2122; padding: 2px; border-radius: 4px; border: 1px solid #1a1c1d; align-items: center; }
        
        .tool-btn { 
            background-color: #3b4043; border: 1px solid #555; color: #d0d0d0; 
            padding: 4px 10px; cursor: pointer; border-radius: 3px; font-size: 12px;
            display: flex; align-items: center; gap: 5px;
        }
        .tool-btn svg { width: 14px; height: 14px; fill: currentColor; stroke: currentColor; stroke-width: 0; }
        
        .tool-btn:hover { background-color: #4b5155; }
        .tool-btn.active { background-color: #ff6600; color: #fff; border-color: #cc5200; font-weight: bold; }
        
        #btn-play.playing { background-color: #33cc33; border-color: #009900; color: #fff; }

        select, input[type="number"] { background-color: #1e2122; color: #d0d0d0; border: 1px solid #555; padding: 3px; border-radius: 3px; outline: none; }
        input[type="number"] { width: 50px; text-align: center; }
        
        .toolbar-label { display: flex; align-items: center; gap: 4px; font-size: 12px; white-space: nowrap; }
        .toolbar-label svg { width: 14px; height: 14px; stroke: #aaa; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        .spacer { flex-grow: 1; }
        
        .dropdown { position: relative; display: inline-block; }
        .dropdown-btn { background-color: #2a5a2a; border-color: #1e401e; }
        .dropdown-content, .context-menu {
            display: none; position: absolute;
            background-color: #2c3032; min-width: 140px; box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            z-index: 2000; border: 1px solid #555; border-radius: 4px; overflow: hidden;
        }
        .dropdown-content { right: 0; top: 100%; }
        
        .dropdown-content a, .context-menu a {
            color: #d0d0d0; padding: 10px 14px; text-decoration: none; display: block; font-size: 12px;
            border-bottom: 1px solid #1a1c1d; cursor: pointer;
        }
        .dropdown-content a:last-child, .context-menu a:last-child { border-bottom: none; }
        .dropdown-content a:hover, .context-menu a:hover { background-color: #4b5155; color: #fff; }
        .dropdown:hover .dropdown-content { display: block; }
        
        .context-menu.show { display: block; }
        .context-menu a.danger { color: #ff6666; }
        .context-menu a.danger:hover { background-color: #ff3333; color: #fff; }

        #editor-area { display: flex; flex: 1; overflow: hidden; position: relative; z-index: 1; }
        
        #track-panel-container {
            width: 200px; min-width: 150px; max-width: 500px;
            background-color: #2c3032; border-right: 1px solid #1a1c1d;
            display: flex; flex-direction: column; 
            overflow: hidden; flex-shrink: 0;
            position: relative; 
            transition: width 0.3s ease, min-width 0.3s ease;
        }
        #track-panel-container.closed { width: 0px !important; min-width: 0; border-right: none; }
        #track-panel-container.no-transition { transition: none; }
        
        #panel-resizer {
            position: absolute; top: 0; right: 0; width: 6px; height: 100%;
            cursor: col-resize; z-index: 10;
            background-color: transparent;
        }
        #panel-resizer:hover { background-color: rgba(255, 102, 0, 0.5); }

        #track-panel-header {
            height: 30px; background-color: #3b4043; border-bottom: 1px solid #1a1c1d;
            display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; flex-shrink: 0;
        }

        #ref-track-container { flex-shrink: 0; border-bottom: 2px solid #1a1c1d; }
        .ref-track-item { display: flex; flex-direction: column; padding: 8px; background-color: #242729; gap: 6px; }
        .ref-file-label {
            font-size: 10px; background: #3b4043; padding: 4px 6px; border-radius: 3px; cursor: pointer; border: 1px solid #555;
            display: flex; align-items: center; justify-content: center;
        }
        .ref-file-label:hover { background: #4b5155; color: #fff; border-color: #888; }
        .ref-file-name { font-size: 11px; color: #aaa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-grow: 1; padding-left: 8px; }
        
        #track-list { flex: 1; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; position: relative; }
        #track-list::-webkit-scrollbar { width: 6px; }
        #track-list::-webkit-scrollbar-track { background: #1e2122; }
        #track-list::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
        
        .track-item {
            display: flex; flex-direction: column; padding: 8px; border-bottom: 1px solid #1a1c1d;
            cursor: pointer; background-color: #2c3032; transition: background-color 0.1s; gap: 6px;
            position: relative;
        }
        .track-item:hover { background-color: #3b4043; }
        .track-item.active { background-color: #4b5155; }
        
        .track-item.is-linked {
            padding-left: 28px;
            background-color: #26292a;
        }
        .track-item.is-linked.active { background-color: #3b4043; }

        .track-item.dragging {
            opacity: 0.95;
            background-color: #5b6266 !important;
            border: 1px solid #ff6600;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            z-index: 3000;
        }
        
        .track-item-top { display: flex; align-items: center; width: 100%; }
        
        .track-color-indicator { width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; border: 1px solid #000; flex-shrink: 0; cursor: pointer; }
        .track-name { flex-grow: 1; font-size: 12px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: text; }
        
        .track-name.is-linked-name { color: #88ccff; font-weight: normal; }

        .transpose-badge {
            font-size: 9px; background-color: #555; color: #fff; 
            padding: 2px 4px; border-radius: 3px; margin-left: 6px; 
            font-weight: bold; vertical-align: middle;
        }

        .track-controls { display: flex; gap: 4px; }
        .tc-btn { 
            width: 22px; height: 22px; border-radius: 3px; border: 1px solid #555; background-color: #1e2122; 
            color: #aaa; font-size: 10px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .tc-btn:hover { border-color: #888; color: #fff; }
        .tc-btn.muted { background-color: #ff3333; color: #fff; border-color: #cc0000; }
        .tc-btn.soloed { background-color: #33cc33; color: #fff; border-color: #009900; }
        .tc-btn.menu-btn:hover { background-color: #555; }
        
        .track-vol-container { display: flex; align-items: center; gap: 5px; padding: 0 4px; }
        .track-vol-container label { font-size: 10px; color: #888; }
        .track-vol { flex-grow: 1; accent-color: #ff6600; cursor: pointer; height: 4px; }
        
        /* 判定領域を広げるための変更 */
        .track-drag-handle {
            cursor: grab;
            display: flex; align-items: center; justify-content: center;
            color: #666; touch-action: none;
            padding: 10px; margin: -10px -4px -10px -10px; 
        }
        .track-drag-handle:hover { color: #aaa; }
        .track-drag-handle:active { cursor: grabbing; color: #fff; }
        
        #btn-add-track {
            margin: 10px; padding: 6px; background-color: #3b4043; border: 1px dashed #555;
            color: #aaa; cursor: pointer; border-radius: 4px; text-align: center; font-size: 12px;
        }
        #btn-add-track:hover { background-color: #4b5155; color: #fff; border-color: #888; }

        #roll-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; background-color: #1a1c1d; }
        
        #timeline-container { height: 30px; display: flex; flex-shrink: 0; }
        #timeline-corner { width: 80px; background-color: #3b4043; border-right: 1px solid #1a1c1d; border-bottom: 1px solid #1a1c1d; flex-shrink: 0; }
        #timeline-canvas { flex: 1; background-color: #3b4043; border-bottom: 1px solid #1a1c1d; touch-action: none; cursor: pointer; }
        
        #h-scroll-container { height: 12px; display: flex; flex-shrink: 0; background-color: #1e2122; border-bottom: 1px solid #111; }
        #h-scroll-spacer { width: 80px; flex-shrink: 0; border-right: 1px solid #1a1c1d; background-color: #1e2122; }
        #h-scroll-track { flex: 1; display: flex; align-items: center; padding: 0 4px; }
        
        #grid-layout { display: flex; flex: 1; overflow: hidden; }
        #grid-container { display: flex; flex: 1; overflow: hidden; }
        #keyboard-canvas { width: 80px; background-color: #1e2122; border-right: 1px solid #1a1c1d; flex-shrink: 0; touch-action: none; cursor: pointer; }
        #grid-canvas { flex: 1; background-color: #1e2122; outline: none; touch-action: none; }
        
        #v-scroll-container { width: 14px; background-color: #1e2122; border-left: 1px solid #111; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; padding: 4px 0; }
        
        .custom-scrollbar {
            -webkit-appearance: none; background: transparent; width: 100%; height: 100%; margin: 0; outline: none;
        }
        .custom-scrollbar::-webkit-slider-runnable-track { background: #111; border-radius: 4px; }
        .custom-scrollbar::-webkit-slider-thumb {
            -webkit-appearance: none; background: #555; border: 1px solid #333; border-radius: 4px; cursor: pointer;
        }
        .custom-scrollbar::-webkit-slider-thumb:hover { background: #777; }
        .custom-scrollbar:active::-webkit-slider-thumb { background: #ff6600; border-color: #cc5200; }
        
        #scroll-h.custom-scrollbar::-webkit-slider-runnable-track { height: 8px; }
        #scroll-h.custom-scrollbar::-webkit-slider-thumb { height: 8px; width: 60px; margin-top: 0px; }
        #scroll-v.custom-scrollbar { -webkit-appearance: slider-vertical; width: 8px; }
        
        .modal-overlay {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background-color: #2c3032; border: 1px solid #555; border-radius: 8px; padding: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8); z-index: 1000;
        }
        .modal-overlay.show { display: block; }
        
        #synth-modal { width: 340px; }
        #color-picker-modal { width: 240px; padding: 15px; }
        #midi-load-modal { width: 320px; }
        
        .modal-title { font-size: 16px; font-weight: bold; margin-bottom: 15px; color: #ff6600; border-bottom: 1px solid #555; padding-bottom: 5px; }
        .modal-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 13px; }
        .modal-row select, .modal-row input { width: 130px; }
        
        .synth-knobs { display: flex; justify-content: space-between; margin-top: 20px; }
        .knob-wrapper { display: flex; flex-direction: column; align-items: center; width: 65px; }
        .knob { width: 40px; height: 40px; position: relative; cursor: ns-resize; }
        .knob svg { width: 100%; height: 100%; transform: rotate(135deg); pointer-events: none; }
        .knob-bg, .knob-val { fill: none; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 70.686 100; }
        .knob-bg { stroke: #1e2122; stroke-dashoffset: 0; }
        .knob-val { stroke: #ff6600; stroke-dashoffset: 70.686; transition: stroke-dashoffset 0.05s linear; }
        .knob-label { font-size: 11px; color: #aaa; margin-top: 8px; font-weight: bold; }
        .knob-value-disp { font-size: 10px; color: #fff; margin-top: 2px; font-variant-numeric: tabular-nums; }
        
        .modal-btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .modal-btn { flex: 1; padding: 8px; background-color: #3b4043; border: 1px solid #555; color: #fff; cursor: pointer; border-radius: 4px; }
        .modal-btn.primary { background-color: #ff6600; border-color: #cc5200; font-weight: bold; }
        .modal-btn:hover { background-color: #4b5155; }
        .modal-btn.primary:hover { background-color: #ff8533; }
        
        .color-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin-bottom: 10px; }
        .color-cell { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 1px solid #111; }
        .color-cell:hover { transform: scale(1.2); box-shadow: 0 0 5px rgba(255,255,255,0.8); }

        #midi-mismatch-warning {
            display: none; background-color: #3a2222; border: 1px solid #ff3333; 
            padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 12px;
        }
        #midi-mismatch-warning label { cursor: pointer; display: flex; align-items: center; gap: 6px; margin-bottom: 6px; color: #eee; }
        #midi-mismatch-warning label:last-child { margin-bottom: 0; }

        #toast-container {
            position: fixed; bottom: 20px; left: 20px; display: flex; flex-direction: column; 
            gap: 8px; z-index: 9999; pointer-events: none;
        }

        /* モバイル専用フローティング編集パネル */
        #mobile-edit-panel {
            display: none;
            position: fixed; bottom: 30px; right: 30px;
            background-color: rgba(44, 48, 50, 0.95);
            border: 1px solid #555; border-radius: 8px; padding: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
            z-index: 2000;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 8px;
        }
        #mobile-edit-panel.show { display: grid; }
        .m-edit-btn {
            width: 44px; height: 44px; border-radius: 6px;
            background-color: #3b4043; border: 1px solid #555; color: #d0d0d0;
            font-size: 14px; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .m-edit-btn:active { background-color: #ff6600; color: #fff; border-color: #cc5200; }
        .m-edit-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
</head>
<body>

<div id="app-container">
    <div id="toolbar">
        <button class="tool-btn" id="btn-toggle-panel" title="Toggle Track Panel">
            <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        </button>
        
        <div class="tool-btn-group">
            <button class="tool-btn" id="btn-play" title="Play/Stop (Space)">
                <svg viewBox="0 0 24 24" fill="currentColor" id="icon-play"><path d="M8 5v14l11-7z"/></svg> <span id="label-play">Play</span>
            </button>
        </div>

        <div class="tool-btn-group">
            <button class="tool-btn" id="btn-undo" title="Undo (Ctrl+Z)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"></polyline><path d="M20 20v-7a4 4 0 0 0-4-4H4"></path></svg>
            </button>
            <button class="tool-btn" id="btn-redo" title="Redo (Ctrl+Shift+Z)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 14 20 9 15 4"></polyline><path d="M4 20v-7a4 4 0 0 1 4-4h12"></path></svg>
            </button>
        </div>
        
        <div class="tool-btn-group">
            <button class="tool-btn active" id="btn-draw" title="Draw (P)">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.586 7.586"></path><circle cx="11" cy="11" r="2"></circle></svg> Draw
            </button>
            <button class="tool-btn" id="btn-select" title="Select (E)">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg> Select
            </button>
            <button class="tool-btn" id="btn-mute" title="Mute (T)">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg> Mute
            </button>
            <button class="tool-btn" id="btn-delete" title="Delete (D)">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg> Delete
            </button>
        </div>
        
        <div style="display:flex; align-items:center; gap:10px;">
            <div style="display:flex; align-items:center; gap:4px;">
                <label for="snap-select" class="toolbar-label" title="Snap">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 11V9a8 8 0 0 1 16 0v2"></path>
                        <path d="M4 11h5v4H4z" fill="currentColor"></path>
                        <path d="M15 11h5v4h-5z" fill="currentColor"></path>
                    </svg>
                </label>
                <select id="snap-select">
                    <option value="384">Bar</option>
                    <option value="96">Beat</option>
                    <option value="48">1/2 Beat</option>
                    <option value="24" selected>Step</option>
                    <option value="12">1/2 Step</option>
                    <option value="6">1/4 Step</option>
                    <option value="4">1/6 Step</option>
                    <option value="0">None</option>
                </select>
            </div>
            
            <div style="display:flex; align-items:center; gap:4px;">
                <label for="bpm-input" class="toolbar-label" title="BPM">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                </label>
                <input type="number" id="bpm-input" value="120" min="20" max="300">
            </div>

            <div class="tool-btn-group" style="padding: 0 5px; gap:4px;">
                <label for="transpose-input" class="toolbar-label" title="Global Transpose">
                    <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
                </label>
                <input type="number" id="transpose-input" value="0" min="-24" max="24" style="width: 35px;">
            </div>

            <div class="tool-btn-group" style="padding: 0 5px; gap:4px;">
                <label for="master-vol-slider" class="toolbar-label" title="Master Volume">
                    <svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                </label>
                <input type="range" id="master-vol-slider" min="0" max="150" value="100" style="width: 100px; accent-color: #ff6600;">
            </div>
        </div>
        
        <div class="spacer"></div>
        
        <div class="dropdown">
            <button class="tool-btn dropdown-btn" title="File Menu">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" style="margin-right:4px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg> File ▼
            </button>
            <div class="dropdown-content">
                <a href="#" id="menu-load-midi">Load MIDI...</a>
                <a href="#" id="menu-export-midi-links">Export MIDI (Include Links)</a>
                <a href="#" id="menu-export-midi-standard">Export MIDI (Standard)</a>
            </div>
        </div>
        <input type="file" id="hidden-midi-input" accept=".mid,.midi" style="display: none;">
    </div>
    
    <div id="editor-area">
        <div id="track-panel-container">
            <div id="panel-resizer"></div>
            <div id="track-panel-header">TRACKS</div>
            <div id="ref-track-container"></div>
            <div id="track-list"></div>
        </div>
        
        <div id="roll-area">
            <div id="timeline-container">
                <div id="timeline-corner"></div>
                <canvas id="timeline-canvas"></canvas>
            </div>
            
            <div id="h-scroll-container">
                <div id="h-scroll-spacer"></div>
                <div id="h-scroll-track">
                    <input type="range" id="scroll-h" class="custom-scrollbar" min="0" max="2000" step="1" value="0">
                </div>
            </div>

            <div id="grid-layout">
                <div id="grid-container">
                    <canvas id="keyboard-canvas"></canvas>
                    <canvas id="grid-canvas" tabindex="0"></canvas>
                </div>
                <div id="v-scroll-container">
                    <input type="range" id="scroll-v" class="custom-scrollbar" min="0" max="127" step="0.1" value="84">
                </div>
            </div>
        </div>
    </div>
</div>

<div id="track-context-menu" class="context-menu">
    <a href="#" id="ctx-menu-duplicate">Duplicate</a>
    <a href="#" id="ctx-menu-link">🔗 Create Link</a>
    <a href="#" id="ctx-menu-delete" class="danger">Delete</a>
</div>

<!-- その他のモーダルは省略せずに記載 -->
<div class="modal-overlay" id="synth-modal">
    <div class="modal-title" id="modal-track-name">Track Settings</div>
    <div class="modal-row">
        <label>Transpose</label>
        <input type="number" id="synth-transpose" value="0" min="-48" max="48">
    </div>
    <div class="modal-row" style="margin-bottom: 20px;">
        <label>Waveform</label>
        <select id="synth-waveform">
            <option value="sawtooth">Sawtooth</option>
            <option value="square">Square</option>
            <option value="triangle">Triangle</option>
            <option value="sine">Sine</option>
            <option value="pulse25">Pulse 25%</option>
            <option value="pulse12">Pulse 12.5%</option>
        </select>
    </div>
    <div class="synth-knobs">
        <div class="knob-wrapper" data-param="attack">
            <div class="knob">
                <svg viewBox="0 0 40 40"><circle class="knob-bg" cx="20" cy="20" r="15"></circle><circle class="knob-val" cx="20" cy="20" r="15"></circle></svg>
            </div>
            <div class="knob-label">Attack</div><div class="knob-value-disp">0.1ms</div>
        </div>
        <div class="knob-wrapper" data-param="decay">
            <div class="knob">
                <svg viewBox="0 0 40 40"><circle class="knob-bg" cx="20" cy="20" r="15"></circle><circle class="knob-val" cx="20" cy="20" r="15"></circle></svg>
            </div>
            <div class="knob-label">Decay</div><div class="knob-value-disp">100ms</div>
        </div>
        <div class="knob-wrapper" data-param="sustain">
            <div class="knob">
                <svg viewBox="0 0 40 40"><circle class="knob-bg" cx="20" cy="20" r="15"></circle><circle class="knob-val" cx="20" cy="20" r="15"></circle></svg>
            </div>
            <div class="knob-label">Sustain</div><div class="knob-value-disp">75%</div>
        </div>
        <div class="knob-wrapper" data-param="release">
            <div class="knob">
                <svg viewBox="0 0 40 40"><circle class="knob-bg" cx="20" cy="20" r="15"></circle><circle class="knob-val" cx="20" cy="20" r="15"></circle></svg>
            </div>
            <div class="knob-label">Release</div><div class="knob-value-disp">5ms</div>
        </div>
    </div>
    <button class="modal-btn primary" id="modal-close" style="width: 100%; margin-top: 25px;">Done</button>
</div>

<div class="modal-overlay" id="color-picker-modal">
    <div class="modal-title" style="font-size: 14px;">Select Track Color</div>
    <div class="color-grid" id="color-grid"></div>
    <button class="modal-btn" id="color-modal-close" style="width: 100%;">Cancel</button>
</div>

<div class="modal-overlay" id="midi-load-modal">
    <div class="modal-title" style="font-size: 15px;">Load MIDI File</div>
    <div style="font-size: 13px; font-weight: bold; margin-bottom: 4px; color: #fff;" id="midi-info-title">Parsing file...</div>
    <div style="font-size: 12px; margin-bottom: 15px; color: #aaa;" id="midi-info-text"></div>
    <div id="midi-mismatch-warning">
        <div style="color: #ff6666; font-weight: bold; margin-bottom: 6px;">⚠️ Mismatched Link Data Detected</div>
        <div class="mismatch-count-msg" style="margin-bottom: 8px;"></div>
        <label><input type="radio" name="mismatch-action" value="keep" checked> Force Keep Links (Override notes)</label>
        <label><input type="radio" name="mismatch-action" value="independent"> Import as Independent Tracks</label>
    </div>
    <div class="modal-row">
        <label>Tracks:</label>
        <select id="midi-load-track-mode">
            <option value="overwrite">Overwrite All</option>
            <option value="append">Append as New Tracks</option>
        </select>
    </div>
    <div class="modal-row">
        <label>BPM:</label>
        <select id="midi-load-bpm-mode">
            <option value="use_midi">Use MIDI BPM</option>
            <option value="keep">Keep Current</option>
        </select>
    </div>
    <div class="modal-btn-group">
        <button class="modal-btn" id="btn-midi-cancel">Cancel</button>
        <button class="modal-btn primary" id="btn-midi-confirm">Load</button>
    </div>
</div>

<div id="toast-container"></div>

<!-- モバイル専用編集パネル (4x2) -->
<div id="mobile-edit-panel">
    <button class="m-edit-btn" id="mbtn-copy" title="Copy">
        <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
    </button>
    <button class="m-edit-btn" id="mbtn-cut" title="Cut">
        <svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><line x1="20" y1="4" x2="8.12" y2="15.88"></line><line x1="14.47" y1="14.48" x2="20" y2="20"></line><line x1="8.12" y1="8.12" x2="12" y2="12"></line></svg>
    </button>
    <button class="m-edit-btn" id="mbtn-paste" title="Paste">
        <svg viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
    </button>
    <button class="m-edit-btn" id="mbtn-delete" title="Delete">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
    <button class="m-edit-btn" id="mbtn-up12">+12</button>
    <button class="m-edit-btn" id="mbtn-up1">+1</button>
    <button class="m-edit-btn" id="mbtn-down1">-1</button>
    <button class="m-edit-btn" id="mbtn-down12">-12</button>
</div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(err => console.error(err));
        });
    }
</script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
